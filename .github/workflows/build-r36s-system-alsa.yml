name: Build R36S mkxp-z system ALSA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Bootstrap container
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends             ca-certificates git sudo python3 python3-pip file binutils zip unzip xz-utils             curl wget build-essential cmake ninja-build autoconf automake             pkg-config libtool libtool-bin bison ruby xxd zlib1g-dev libbz2-dev
          python3 -m pip install --no-cache-dir "cmake==3.31.6" "meson==0.63.3"
          cmake --version
          meson --version

      - name: Clone R36S port
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Periko21/mkxp-z-r36s.git /root/r36s-port
          ln -s /root/r36s-port/build /root/build
          chmod +x /root/r36s-port/build/*.sh
          cd /root/r36s-port
          git rev-parse HEAD | tee /root/r36s-port-commit.txt

      - name: Prepare ARM toolchain
        shell: bash
        run: |
          set -euxo pipefail
          cd /root/r36s-port
          build/01-host-toolchain.sh

      - name: Prepare GPU stubs
        shell: bash
        run: |
          set -euxo pipefail
          cd /root/r36s-port
          build/02-gpu-stubs.sh

      - name: Pin mkxp-z to pre-overhaul revision
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/root/r36s-port/build/03-source-and-patches.sh")
          s = p.read_text()
          old = 'git clone -q --recurse-submodules https://github.com/mkxp-z/mkxp-z "$SRC"'
          new = '''git clone -q --recurse-submodules https://github.com/mkxp-z/mkxp-z "$SRC"
          git -C "$SRC" checkout -q 826929eeb3ebc4b887c011604919217a790770f4
          git -C "$SRC" submodule sync --recursive
          git -C "$SRC" submodule update --init --recursive'''

          if old not in s:
              raise SystemExit("mkxp-z clone command not found in R36S port script")

          p.write_text(s.replace(old, new, 1))
          PY

          grep -n -A4 "git clone -q --recurse-submodules" /root/r36s-port/build/03-source-and-patches.sh

      - name: Fetch mkxp-z and apply original R36S patches
        shell: bash
        run: |
          set -euxo pipefail
          cd /root/r36s-port
          build/03-source-and-patches.sh
          cd /root/mkxp-z
          git rev-parse HEAD | tee /root/mkxp-z-commit.txt
          test "$(cat /root/mkxp-z-commit.txt)" = "826929eeb3ebc4b887c011604919217a790770f4"

      - name: Force OpenAL to link system ALSA
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/root/mkxp-z/linux/Makefile")
          s = p.read_text()

          lines = s.splitlines()
          changed = False
          for i, line in enumerate(lines):
              if line.startswith("OPENAL_FLAGS :=") and "ALSOFT_DLOPEN" not in line:
                  lines[i] = line.replace(
                      "OPENAL_FLAGS :=",
                      "OPENAL_FLAGS := -DALSOFT_DLOPEN=OFF"
                  )
                  changed = True
                  break

          if not changed and not any("ALSOFT_DLOPEN=OFF" in x for x in lines):
              raise SystemExit("Could not patch OPENAL_FLAGS")

          p.write_text("\n".join(lines) + "\n")
          PY

          grep -n "OPENAL_FLAGS :=" /root/mkxp-z/linux/Makefile | head -5

      - name: Allow libasound as ArkOS system library
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/root/r36s-port/build/05-build-and-package.sh")
          s = p.read_text()
          old = "libutil.so.1|libcrypt.so.[12]|ld-linux-armhf.so.3"
          new = "libutil.so.1|libcrypt.so.[12]|libasound.so.2|ld-linux-armhf.so.3"

          if old in s:
              s = s.replace(old, new, 1)
          elif "libasound.so.2" not in s:
              raise SystemExit("Could not patch package dependency allow-list")

          p.write_text(s)
          PY

          grep -n "libasound.so.2" /root/r36s-port/build/05-build-and-package.sh

      - name: Patch libpng check at the correct build stage
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/root/r36s-port/build/04-build-deps.sh")
          s = p.read_text()

          marker = 'mk "$DL/libpng/Makefile" >/dev/null\n'
          extra = (
              'mk "$DL/libpng/Makefile" >/dev/null\n'
              'sed -i \'s@^#if PNG_ZLIB_VERNUM != 0 && PNG_ZLIB_VERNUM != ZLIB_VERNUM@#if 0 /* R36S cross-build: target zlib provided explicitly */@\' "$DL/libpng/pngpriv.h"\n'
              'grep -q "R36S cross-build: target zlib" "$DL/libpng/pngpriv.h" || { echo "FATAL: libpng check patch failed"; exit 1; }\n'
          )

          if marker not in s:
              raise SystemExit("libpng configure marker not found in build script")

          p.write_text(s.replace(marker, extra, 1))
          PY

          grep -n -A18 'libpng  (with' /root/r36s-port/build/04-build-deps.sh

      - name: Isolate RubyGems from host Ruby
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/root/r36s-port/build/04-build-deps.sh")
          s = p.read_text()
          marker = 'mk "$DL/ruby/configure" >/dev/null\n'
          extra = (
              'mk "$DL/ruby/configure" >/dev/null\n'
              'mkdir -p "$DL/ruby/lib/rubygems/defaults"\n'
              'printf "%s\\n" "# R36S cross-build: do not load host OS RubyGems defaults" > "$DL/ruby/lib/rubygems/defaults/operating_system.rb"\n'
              'printf "%s\\n" "# R36S cross-build: do not load host Ruby implementation defaults" > "$DL/ruby/lib/rubygems/defaults/ruby.rb"\n'
          )
          if marker not in s:
              raise SystemExit("Ruby configure marker not found in build script")
          p.write_text(s.replace(marker, extra, 1))
          PY

          grep -n -A12 'Ruby 3.1.3' /root/r36s-port/build/04-build-deps.sh

      - name: Build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd /root/r36s-port
          if ! build/04-build-deps.sh; then
            echo "===== OPENAL BUILD LOG ====="
            cat /tmp/openal-build.log 2>/dev/null || true
            echo "===== END OPENAL BUILD LOG ====="
            exit 1
          fi

      - name: Build mkxp-z and package
        shell: bash
        run: |
          set -euxo pipefail
          cd /root/r36s-port
          build/05-build-and-package.sh

      - name: Verify ALSA linkage
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/root/package/mkxp/mkxp-z
          test -x "$BIN"

          mkdir -p /root/artifact
          file "$BIN" | tee /root/artifact/file.txt
          arm-linux-gnueabihf-readelf -d "$BIN" | tee /root/artifact/readelf-dynamic.txt

          if ! arm-linux-gnueabihf-readelf -d "$BIN" | grep -q "libasound.so.2"; then
            echo "ERROR: final mkxp-z does not have libasound.so.2 in DT_NEEDED" >&2
            exit 1
          fi

          cp "$BIN" /root/artifact/mkxp-z
          chmod +x /root/artifact/mkxp-z
          cp /root/fire-ash-port.zip /root/artifact/fire-ash-port-system-alsa.zip

          {
            echo "R36S mkxp-z system ALSA build"
            echo
            echo "R36S port commit:"
            cat /root/r36s-port-commit.txt
            echo
            echo "mkxp-z commit:"
            cat /root/mkxp-z-commit.txt
            echo
            echo "Patch: OpenAL Soft built with ALSOFT_DLOPEN=OFF"
            echo "Expected runtime dependency: libasound.so.2 from ArkOS"
          } > /root/artifact/BUILD-INFO.txt

          cat > /root/artifact/INSTALL.txt <<'EOF'
          INSTALL ON R36S
          ================

          1. Back up:
             /roms/ports/mkxp/mkxp-z

          2. Replace ONLY that file with the new mkxp-z in this artifact.

          3. Do NOT replace:
             Scripts/
             RTP.rb
             Load.rb
             Updater.rb
             DiscordRichPresence.rb
             Data/
             Graphics/
             Audio/
             saves

          The existing Rejuvenation compatibility fixes stay untouched.
          EOF

      - name: Upload R36S engine
        uses: actions/upload-artifact@v4
        with:
          name: r36s-mkxp-z-system-alsa
          path: /root/artifact/
          if-no-files-found: error
          retention-days: 7
